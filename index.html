<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Cobrinha</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --text: #e2e8f0;
        --accent: #22c55e;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .game {
        width: min(92vw, 520px);
        background: color-mix(in srgb, var(--panel) 85%, black 15%);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 20px 40px rgb(0 0 0 / 35%);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 12px;
      }

      .hud strong {
        color: var(--accent);
      }

      #board {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        background: #020617;
        border: 1px solid #334155;
      }

      .controls {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #052e16;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
      }

      .message {
        color: #cbd5e1;
      }

      .message.game-over {
        color: var(--danger);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="game">
      <header class="hud">
        <div>Pontos: <strong id="score">0</strong></div>
        <div>Recorde: <strong id="best">0</strong></div>
      </header>

      <canvas id="board" width="400" height="400" aria-label="Jogo da cobrinha"></canvas>

      <footer class="controls">
        <span id="message" class="message">Use as setas para começar</span>
        <button id="restart" type="button">Reiniciar</button>
      </footer>
    </main>

    <script>
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const messageEl = document.getElementById('message');
      const restartBtn = document.getElementById('restart');

      const GRID_SIZE = 20;
      const CELL_SIZE = canvas.width / GRID_SIZE;
      const STEP_TIME = 130;

      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let best;
      let loop;
      let gameOver;

      function randomCell() {
        return {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE),
        };
      }

      function spawnFood() {
        let next = randomCell();
        while (snake.some((segment) => segment.x === next.x && segment.y === next.y)) {
          next = randomCell();
        }
        food = next;
      }

      function reset() {
        snake = [
          { x: 8, y: 10 },
          { x: 7, y: 10 },
          { x: 6, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        nextDirection = direction;
        score = 0;
        gameOver = false;
        messageEl.textContent = 'Use as setas para mover';
        messageEl.classList.remove('game-over');
        scoreEl.textContent = score;
        spawnFood();
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      }

      function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 1; i < GRID_SIZE; i += 1) {
          const p = i * CELL_SIZE;
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.13)';
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(canvas.width, p);
          ctx.stroke();
        }
      }

      function tick() {
        if (gameOver) return;

        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        const hitWall = head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
        const hitSelf = snake.some((segment) => segment.x === head.x && segment.y === head.y);

        if (hitWall || hitSelf) {
          gameOver = true;
          messageEl.textContent = 'Game over! Aperte Reiniciar';
          messageEl.classList.add('game-over');
          return;
        }

        snake.unshift(head);

        const ateFood = head.x === food.x && head.y === food.y;
        if (ateFood) {
          score += 10;
          scoreEl.textContent = score;
          best = Math.max(best, score);
          localStorage.setItem('snake-best', String(best));
          bestEl.textContent = best;
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function render() {
        drawGrid();

        drawCell(food.x, food.y, '#ef4444');

        snake.forEach((segment, index) => {
          drawCell(segment.x, segment.y, index === 0 ? '#4ade80' : '#22c55e');
        });
      }

      function gameLoop() {
        tick();
        render();
      }

      function setDirection(dx, dy) {
        if (gameOver) return;
        if (dx === -direction.x && dy === -direction.y) return;
        nextDirection = { x: dx, y: dy };
      }

      window.addEventListener('keydown', (event) => {
        switch (event.key) {
          case 'ArrowUp':
            setDirection(0, -1);
            break;
          case 'ArrowDown':
            setDirection(0, 1);
            break;
          case 'ArrowLeft':
            setDirection(-1, 0);
            break;
          case 'ArrowRight':
            setDirection(1, 0);
            break;
          default:
            return;
        }
        event.preventDefault();
      });

      restartBtn.addEventListener('click', () => {
        reset();
      });

      best = Number(localStorage.getItem('snake-best')) || 0;
      bestEl.textContent = best;
      reset();
      render();
      clearInterval(loop);
      loop = setInterval(gameLoop, STEP_TIME);
    </script>
  </body>
</html>
